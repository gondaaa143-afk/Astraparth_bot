<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Astra Parth</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <header class="top">
    <h1 class="logo">Astra Parth</h1>
    <button class="icon-btn">🔍</button>
  </header>

  <section class="hero">
    <h2>UPSC Premium</h2>
    <p>Daily Current Affairs • Notes • PYQs</p>

    <button id="continueBtn">Continue Learning</button>
  </section>

  <section class="grid">

    <div class="glass-card" data-page="courses">
      <h3>📚 Courses</h3>
      <span>120 Lessons</span>
    </div>

    <div class="glass-card" data-page="tests">
      <h3>📝 Mock Tests</h3>
      <span>Daily Practice</span>
    </div>

    <div class="glass-card" data-page="calendar">
      <h3>📅 Calendar</h3>
      <span>Study Plan</span>
    </div>

    <div class="glass-card" data-page="profile">
      <h3>👤 Profile</h3>
      <span id="username">Telegram User</span>
    </div>

  </section>

</div>

<nav class="bottom-nav">

<button data-nav="home">🏠</button>
<button data-nav="courses">📚</button>
<button data-nav="tests">📝</button>
<button data-nav="profile">👤</button>

</nav>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
