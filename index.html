<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Parth</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f2f2f2;
    padding:20px;
    color:#111;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:28px;
    font-weight:800;
}

.icon{
    width:45px;
    height:45px;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.hero{
    background:#111;
    color:#fff;
    border-radius:28px;
    padding:25px;
    margin-bottom:20px;
}

.hero h2{
    font-size:24px;
}

.hero p{
    opacity:.8;
    margin-top:8px;
}

.btn{
    display:inline-block;
    margin-top:15px;
    background:#fff;
    color:#111;
    padding:12px 18px;
    border-radius:14px;
    text-decoration:none;
    font-weight:600;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.card h3{
    margin-bottom:8px;
}

.bottom-nav{
    position:fixed;
    bottom:15px;
    left:15px;
    right:15px;
    background:#fff;
    border-radius:24px;
    padding:15px;
    display:flex;
    justify-content:space-around;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<div id="home" class="page active">
  <div class="top">
    <h1>Astra Parth</h1>
    <div class="search">🔍</div>
  </div>

  <div class="hero">
    <h2>UPSC Preparation</h2>
    <p>Daily Current Affairs, Notes & Tests</p>
  </div>

  <div class="card">Current Affairs</div>
  <div class="card">Mock Tests</div>
</div>

<div id="learn" class="page">
  <h2>Courses</h2>
  <div class="card">GS Foundation</div>
  <div class="card">CSAT</div>
  <div class="card">Hindi Optional</div>
</div>

<div id="test" class="page">
  <h2>Mock Tests</h2>
  <div class="card">Today's Quiz</div>
</div>

<div id="profile" class="page">
  <h2>Profile</h2>
  <div class="card">Progress: 0%</div>
</div>

<div class="nav">
  <button onclick="openPage('home')">🏠</button>
  <button onclick="openPage('learn')">📚</button>
  <button onclick="openPage('test')">📝</button>
  <button onclick="openPage('profile')">👤</button>
</div>

<script src="script.js"></script>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();
</script>

</body>
</html>
